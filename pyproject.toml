[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "confocal-mcp"
version = "0.1.0"
description = "MCP server for driving a Nikon Ti2-E stage and a Baumer GenICam camera"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Qurratul Ain Quais", email = "qurratul.quais@gmail.com" }]
keywords = ["mcp", "microscopy", "nikon-ti2", "genicam", "automation"]

# Core: enough to run the MCP server against the mock stage. The real
# hardware backends are imported lazily, so their heavy / platform-specific
# dependencies live in the optional groups below.
dependencies = [
    "mcp==2.0.0",
    "Pillow==12.3.0",
    "PyYAML==6.0.3",
    "numpy==2.4.6",
]

[project.optional-dependencies]
# Real camera capture (Baumer VCXU-23C via GenICam / harvesters).
camera = [
    "harvesters==1.4.3",
    "genicam==1.5.1",
    "opencv-python==5.0.0.93",
]
# Real stage control (Nikon Ti2 ActiveX SDK). Windows only.
# NOTE: also needs the machine-generated `NkTi2Ax` bindings, which are not
# pip-installable - see the README ("Real stage backend").
sdk = [
    "pywin32==312",
]
# Running the test suite (tests/ - mock backend only, no hardware).
test = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    # Real OpenCV: mosaic.py and worm_follow.py run against a simulated scene.
    # Headless, so a CI runner needs no GL libraries.
    "opencv-python-headless==5.0.0.93",
    # The analysis/ scripts' tests (worm survey) use these for real; the ND2
    # reader and ffmpeg are faked, so neither nd2 nor imageio-ffmpeg is needed.
    # Ranges: scipy 1.18.1 needs Python 3.12 and CI also runs 3.11.
    "scipy>=1.11,<2",
    "scikit-image>=0.24,<1",
]
# The standalone Claude harness loops in harness/ (not the MCP server).
harness = [
    "anthropic==1.0.0",
    "python-dotenv==1.2.3",
]
# The offline scripts in analysis/ (ND2 reading, worm/Physarum analysis,
# movie soundtracks). Run from a source checkout - analysis/ is not in the wheel.
analysis = [
    "scipy==1.18.1",
    "scikit-image==0.26.0",
    "nd2==0.12.0",
    "imageio-ffmpeg==0.6.0",
    "opencv-python==5.0.0.93",
]
# Everything, for a full workstation install.
all = [
    "confocal-mcp[camera,sdk,harness,analysis,test]",
]

[project.scripts]
confocal-mcp = "mcp_server.server_loop:main"
confocal-mcp-nis = "mcp_server.server_nis:main"

[project.urls]
Homepage = "https://github.com/BioNanomics/microscope-agent"
Repository = "https://github.com/BioNanomics/microscope-agent"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server", "acquisition", "harness", "timelapse"]

[tool.pytest.ini_options]
# `python -m` entry points are exercised with runpy, which re-executes a module
# that is already imported; that is intended and the warning is noise.
filterwarnings = [
    "ignore:.*found in sys.modules after import of package:RuntimeWarning",
]
